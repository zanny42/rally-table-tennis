<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="color-scheme" content="dark">
<title>Rally</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap">
<style>
/* Rally 2.0: dark glass. Near-black ground with a warm glow, frosted cards, big light numerals,
   orange for the red-end player and the primary action, white for the black-end player. */
:root{
  --bg:#09090b; --ink:#f5f5f7; --soft:#c7c7cf; --muted:#a1a1aa; --dim:#6b6b75;
  --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.09); --edge:rgba(255,255,255,.1); --edge-2:rgba(255,255,255,.16);
  --off:#26262b; --accent:#ff5a1f; --accent-ink:#ff7a45; --accent-soft:rgba(255,90,31,.18);
  --pb:#e8ecf3; --good:#3ddc84; --bad:#ff8a6a;
  --font:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-card:24px; --ease:cubic-bezier(.23,1,.32,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;background:var(--bg);padding-top:env(safe-area-inset-top,0px);touch-action:manipulation;-webkit-text-size-adjust:100%}
*{touch-action:manipulation}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
input{outline:none}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px}
.glow{position:fixed;pointer-events:none;border-radius:50%;z-index:0}
.glow.tr{right:-170px;top:-200px;width:470px;height:430px;background:radial-gradient(closest-side,rgba(255,90,31,.32),rgba(9,9,11,0))}
.glow.big{left:-120px;top:-170px;width:580px;height:520px;background:radial-gradient(closest-side,rgba(255,90,31,.55),rgba(196,40,90,.22) 55%,rgba(9,9,11,0));animation:rGlow 6s ease-in-out infinite}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
#app.full{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r-card);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted)} .soft{color:var(--soft)} .small{font-size:13px}
.num{font-weight:400;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.num small{font-size:14px;color:var(--soft);letter-spacing:0}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;background:var(--glass-2);color:var(--ink)}
.av.a{background:var(--accent);color:#fff} .av.b{background:var(--pb);color:var(--bg)} .av.sm{width:34px;height:34px;font-size:12px}
.icon-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);display:grid;place-items:center;flex:none;color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.btn{height:56px;border-radius:99px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 30px rgba(255,90,31,.32);transition:transform .15s var(--ease),opacity .2s;text-decoration:none;width:100%}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--glass);border:1px solid var(--edge-2);color:var(--ink);box-shadow:none}
.btn.small{height:44px;font-size:14px;width:auto;padding:0 18px}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--soft);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.input{height:52px;border:1px solid var(--edge-2);border-radius:16px;background:rgba(0,0,0,.35);padding:0 16px;font-size:17px;width:100%}
.input:focus{border-color:var(--accent-ink)}
.err{color:var(--bad);font-size:14px;font-weight:600;margin:0}
.err:empty{display:none}
.note{color:var(--muted);font-size:13px;margin:0}
.pills{display:flex;padding:4px;border-radius:99px;background:var(--glass);border:1px solid var(--edge)}
.pills button{flex:1;min-width:0;height:40px;border:0;border-radius:99px;background:transparent;color:var(--soft);font-weight:500;font-size:13px;white-space:nowrap;transition:background-color .2s var(--ease),color .2s}
.pills button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 14px 0 5px;border-radius:99px;border:1px solid var(--edge-2);background:var(--glass);display:flex;align-items:center;gap:7px;font-weight:500;font-size:14px}
.chip .av{width:30px;height:30px;font-size:11px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chip[aria-pressed="true"] .av{background:var(--bg);color:var(--ink)}
.chip.plain{padding:0 14px}
.radio{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:16px;font-size:15px}
.radio input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.radio.on{background:var(--accent-soft);font-weight:600}
.sec{display:flex;justify-content:space-between;align-items:baseline}
.sec h2{font-size:19px;font-weight:600}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;animation:rBlink 1.4s ease-in-out infinite}
.ok-dot{background:var(--good)}
.scroller{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.live-card{flex:none;width:214px;height:150px;position:relative;padding:14px;border-radius:22px;overflow:hidden;background:var(--glass);border:1px solid var(--edge);display:flex;flex-direction:column;justify-content:space-between;text-align:left;scroll-snap-align:start}
.live-card .hot{position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,90,31,.5),rgba(255,90,31,0))}
.live-card>*{position:relative}
.tag{font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--accent);color:#fff}
.tag.ghost{background:transparent;border:1px solid var(--edge-2);color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:14px 10px}
.day{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.ring{position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-size:12px;font-weight:600;color:var(--ink)}
.bars{display:grid;gap:6px;align-items:end}
.bar{display:flex;flex-direction:column-reverse;gap:2px;transform-origin:bottom}
.bar i{display:block;height:7px;border-radius:1px;background:var(--off)}
.bar i.on{background:var(--accent)} .bar i.w{background:var(--pb)}
.axis{display:grid;gap:6px;text-align:center;font-size:11px;color:var(--dim)}
.prow{display:grid;grid-template-columns:24px 36px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:58px;padding:0 14px;border-radius:18px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);text-align:left;width:100%}
.prow .rk{font-weight:600;color:var(--muted)}
.dots{display:flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--off)}.dots i.w{background:var(--good)}.dots i.l{background:var(--accent)}
.up{color:var(--good)} .down{color:var(--bad)}
.sheetcard{display:flex;flex-direction:column;gap:10px;padding:14px 16px;text-align:left;width:100%}
.gpills{display:flex;flex-wrap:wrap;gap:6px}.gpills span{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--glass-2);font-variant-numeric:tabular-nums}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
/* tab bar */
.tabbar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(342px,calc(100% - 48px));height:64px;padding:8px;border-radius:99px;background:rgba(30,30,34,.72);border:1px solid var(--edge-2);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:space-between}
.tabbar a{height:48px;min-width:48px;border-radius:99px;color:var(--soft);display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px;transition:background-color .25s var(--ease),padding .25s var(--ease)}
.tabbar a svg{width:21px;height:21px}
.tabbar a span{display:none}
.tabbar a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);padding:0 18px}
.tabbar a[aria-current="page"] span{display:inline}
/* tournaments */
.tabbar{width:min(370px,calc(100% - 32px))}
.tabbar a{min-width:44px}
.tabbar a[aria-current="page"]{padding:0 14px}
.opt{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:18px;border:1px solid var(--edge);background:var(--glass);text-align:left;width:100%;transition:border-color .2s,background-color .2s}
.opt b{font-size:15px;font-weight:600} .opt span{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:rgba(255,90,31,.6);background:var(--accent-soft)}
.tt{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--glass-2);color:var(--soft);white-space:nowrap}
.tt.t0{background:rgba(255,90,31,.2);color:#ffb08a} .tt.t1{background:rgba(110,160,255,.2);color:#b2ccff} .tt.t2{background:rgba(61,220,132,.18);color:#9be8bd} .tt.t3{background:rgba(190,120,255,.2);color:#d9b6ff}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:10px;min-height:46px;padding:4px 6px 4px 12px;border-radius:14px;background:rgba(255,255,255,.04)}
.pitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.xbtn{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.toggle{display:flex;align-items:center;gap:12px;font-size:15px;min-height:44px}
.toggle input{width:22px;height:22px;accent-color:var(--accent);margin:0;flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:500;color:var(--muted);text-align:right;padding:6px 4px;font-size:12px}
.tbl td{padding:9px 4px;text-align:right;border-top:1px solid rgba(255,255,255,.06)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td:first-child{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bracket{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-width:176px;flex:none}
.bcol h3{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bm{border-radius:16px;background:var(--glass);border:1px solid var(--edge);padding:8px 10px;display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;font-size:14px}
.bm.live{border-color:rgba(255,90,31,.55)}
.bm .ln{display:flex;justify-content:space-between;gap:8px;color:var(--soft)}
.bm .ln span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm .ln.w{color:var(--ink);font-weight:700}
.bm .ln.tbd{color:var(--dim)}
.teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;text-align:center}
.teams b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);text-align:left;width:100%}
.mrow .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mrow .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* game */
.gtop{display:flex;align-items:center;gap:10px}
.gtop .mid{flex:1;text-align:center;line-height:1.25}
.gtop .mid b{display:block;font-size:17px;font-weight:600}
.gtop .mid span{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.pcard{position:relative;height:clamp(180px,27vh,240px);padding:16px 18px;border-radius:28px;overflow:hidden;text-align:left;background:var(--glass);border:1px solid var(--edge);display:flex;flex-direction:column;justify-content:space-between;width:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:border-color .3s}
.pcard.serving.p0{border-color:rgba(255,90,31,.6)} .pcard.serving.p1{border-color:rgba(232,236,243,.5)}
.pcard:disabled{cursor:default}
.pcard .halo{position:absolute;width:320px;height:320px;border-radius:50%;pointer-events:none;animation:rBreath 3s ease-in-out infinite}
.pcard.p0 .halo{right:-90px;top:-110px;background:radial-gradient(closest-side,rgba(255,90,31,.55),rgba(255,90,31,0))}
.pcard.p1 .halo{left:-90px;bottom:-120px;background:radial-gradient(closest-side,rgba(232,236,243,.28),rgba(232,236,243,0))}
.pcard .flash{position:absolute;inset:0;opacity:0;pointer-events:none}
.pcard.p0 .flash{background:rgba(255,90,31,.35)} .pcard.p1 .flash{background:rgba(232,236,243,.22)}
.pcard>.row,.pcard>.foot{position:relative}
.pcard .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.pcard .score{font-size:clamp(96px,30vw,140px);font-weight:400;line-height:.82;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.pcard.p0 .score{color:#ff6a33} .pcard.p1 .score{color:var(--pb)}
.pips{display:flex;gap:5px}.pips i{width:12px;height:12px;border-radius:50%;border:2px solid currentColor}
.p0 .pips{color:var(--accent)} .p1 .pips{color:var(--pb)}
.pips i.on{background:currentColor}
.serve{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:7px 12px 7px 8px;border-radius:99px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12)}
.ball{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffb48c);box-shadow:0 0 12px rgba(255,140,80,.9);animation:rBounce .9s cubic-bezier(.4,0,.2,1) infinite}
.badge{align-self:flex-start;font-size:13px;font-weight:700;padding:7px 12px;border-radius:99px;animation:rIn .35s var(--ease) both}
.p0 .badge{background:var(--accent);color:#fff} .p1 .badge{background:var(--pb);color:var(--bg)}
.net{display:flex;align-items:center;gap:10px;height:30px}
.net::before,.net::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.14)}
.net span{font-size:13px;color:var(--muted);padding:6px 14px;border-radius:99px;border:1px solid var(--edge);font-variant-numeric:tabular-nums}
.net span.deuce{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;animation:rIn .35s var(--ease) both}
.wave{height:92px;padding:12px 16px 0;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.wave svg{display:block;width:100%;height:62px}
.controls{display:flex;align-items:center;justify-content:center;gap:22px}
.controls .icon-btn{width:56px;height:56px}
.controls .main{width:70px;height:70px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(255,90,31,.45);transition:transform .15s var(--ease)}
.controls .main:active{transform:scale(.92)}
.controls svg{width:24px;height:24px}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(9,9,11,.84);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:32px max(32px,env(safe-area-inset-right,0px)) 32px max(32px,env(safe-area-inset-left,0px));animation:rIn .35s var(--ease) both}
.overlay h2{font-size:clamp(40px,13vw,56px);line-height:.95;letter-spacing:-.03em;position:relative}
.overlay>*{position:relative}
/* sheet + toast */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;animation:rFade .2s var(--ease)}
.sheet{width:100%;max-width:520px;max-height:88%;overflow:auto;background:rgba(24,24,28,.92);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid var(--edge-2);border-bottom:0;border-radius:28px 28px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:rSheet .3s var(--ease)}
.toast{position:fixed;z-index:80;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));max-width:calc(100% - 32px);padding:12px 18px;border-radius:18px;background:rgba(30,30,34,.92);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--edge-2);font-weight:600;font-size:15px;text-align:center;animation:rToast .3s var(--ease)}
.code{font-size:44px;letter-spacing:.3em;font-weight:400;font-variant-numeric:tabular-nums;text-align:center}
/* sign in */
.hero{position:relative;padding:54px 8px 0;display:flex;flex-direction:column;gap:14px;min-height:300px}
.hero h1{font-size:clamp(46px,15vw,62px);line-height:.95;letter-spacing:-.03em}
.eyebrow{align-self:flex-start;font-size:13px;font-weight:500;padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--edge-2)}
.court{position:relative;height:150px;margin:0 8px}
.court .line{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.12)}
.court .shadow{position:absolute;left:4px;bottom:0;width:34px;height:8px;border-radius:50%;background:rgba(0,0,0,.7);animation:rShadowX 2.4s linear infinite alternate,rShadow 1.2s infinite}
.court .bx{position:absolute;left:0;bottom:6px;animation:rX 2.4s linear infinite alternate}
.court .by{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd9c4 45%,#ff8a4c);box-shadow:0 0 24px rgba(255,120,60,.8);animation:rY 1.2s infinite}
/* motion */
@keyframes rUp{from{opacity:.2;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes rGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes rDraw{from{stroke-dashoffset:var(--c)}}
@keyframes rGlow{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes rBlink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes rBreath{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.1)}}
@keyframes rBounce{0%,100%{transform:translateY(0)}45%{transform:translateY(-9px)}}
@keyframes rIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes rPop1{0%{transform:scale(1.22);color:#fff}to{transform:scale(1)}}
@keyframes rPop2{0%{transform:scale(1.22);color:#fff}to{transform:scale(1)}}
@keyframes rFlash1{0%{opacity:.9}to{opacity:0}}
@keyframes rFlash2{0%{opacity:.9}to{opacity:0}}
@keyframes rFade{from{opacity:0}}
@keyframes rSheet{from{transform:translateY(60px);opacity:.5}}
@keyframes rToast{from{transform:translate(-50%,-20px);opacity:0}}
@keyframes rX{from{transform:translateX(0)}to{transform:translateX(min(250px,60vw))}}
@keyframes rShadowX{from{left:4px}to{left:min(254px,calc(60vw + 4px))}}
